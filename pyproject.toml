[project]
name = "mailru-mcp"
version = "0.1.0"
description = "MCP-сервер для почты Mail.ru: чтение, поиск, раскладывание по папкам"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["mcp", "mail.ru", "email", "imap", "claude", "llm"]
dependencies = ["mcp>=1.0"]

[project.scripts]
mailru-mcp = "mailru_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mailru_mcp"]
